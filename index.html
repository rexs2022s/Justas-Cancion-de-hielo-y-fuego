<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enfrentamientos: Canción de Hielo y Fuego</title>
<style>
  :root{
    --bg:#14110f; --surface-1:#1e1a17; --surface-2:#26211d;
    --border:#3a332c; --border-strong:#554b40;
    --text-primary:#efe7db; --text-secondary:#b6ab9c; --text-muted:#7d7365;
    --radius:10px;
    --font-sans:'Georgia','Times New Roman',serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text-primary);
    font-family:var(--font-sans); min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center; padding:1rem;
  }
  button{font-family:inherit}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>
<audio id="bg-music" src="musica.mp3" loop preload="auto"></audio>
<button id="sound-btn" title="Silenciar / activar música" style="position:fixed;top:14px;right:14px;z-index:50;width:44px;height:44px;border-radius:50%;border:0.5px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center">🔊</button>

<div id="app" style="max-width:660px;width:100%;margin:0 auto;padding:1rem 0">

  <div id="home">
    <div style="text-align:center;padding:2rem 1rem 1.5rem">
      <div style="font-size:12px;letter-spacing:4px;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px">Enfrentamientos</div>
      <h1 style="font-size:34px;font-weight:500;margin:0;line-height:1.12;color:var(--text-primary)">Canción de Hielo y Fuego</h1>
      <div style="width:56px;height:1px;background:var(--border-strong);margin:16px auto"></div>
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:2rem">creado por Rex_2022</div>
      <button id="start-btn" style="padding:13px 40px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface-2);cursor:pointer;font-size:15px;font-weight:500;color:var(--text-primary);letter-spacing:1px">Comenzar</button>
    </div>
  </div>

  <div id="pick" style="display:none">
    <div style="text-align:center;margin-bottom:1.25rem">
      <div id="pick-turn" style="font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)"></div>
      <div style="font-size:22px;font-weight:500;color:var(--text-primary);margin-top:4px">Elegí tu Casa</div>
    </div>
    <div id="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px"></div>
    <div style="text-align:center;margin-top:1.25rem">
      <button id="back-btn" style="padding:9px 20px;border-radius:var(--radius);border:0.5px solid var(--border);background:transparent;cursor:pointer;font-size:13px;color:var(--text-secondary)">Volver</button>
    </div>
  </div>

  <div id="joust" style="display:none">
    <div id="scoreboard" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px"></div>
    <div id="rounds" style="display:flex;justify-content:center;gap:8px;margin-bottom:10px"></div>

    <div id="field" style="position:relative;height:190px;background:var(--surface-1);border-radius:12px;overflow:hidden;border:0.5px solid var(--border)">
      <div style="position:absolute;left:0;right:0;top:50%;height:2px;background:var(--border-strong);opacity:.5"></div>
      <div style="position:absolute;left:0;right:0;bottom:26px;height:1px;background:var(--border);opacity:.6"></div>
      <div id="rider1" style="position:absolute;bottom:28px;left:6%;font-size:40px;white-space:nowrap">🐎<span style="font-size:26px">🔱</span></div>
      <div id="rider2" style="position:absolute;bottom:28px;right:6%;font-size:40px;white-space:nowrap;transform:scaleX(-1)">🐎<span style="font-size:26px">🔱</span></div>
      <div id="clash" style="position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:40px">💥</div>
    </div>

    <div id="dice-row" style="display:flex;justify-content:center;gap:20px;margin:14px 0"></div>
    <div id="jlog" style="text-align:center;min-height:42px;font-size:15px;color:var(--text-secondary);margin-bottom:1rem;line-height:1.5"></div>

    <div style="text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button id="roll-btn" style="padding:13px 34px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface-2);cursor:pointer;font-size:15px;font-weight:500;color:var(--text-primary)">Tirar dados</button>
      <button id="reset-btn" style="padding:13px 24px;border-radius:var(--radius);border:0.5px solid var(--border);background:transparent;cursor:pointer;font-size:14px;color:var(--text-secondary)">Nueva justa</button>
    </div>
  </div>

</div>
<script>
(function(){
  const HOUSES=[
    {n:"Lannister",i:"🦁",c:"#A32D2D"},{n:"Stark",i:"🐺",c:"#8a8378"},
    {n:"Baratheon",i:"🦌",c:"#c98a2b"},{n:"Targaryen",i:"🐉",c:"#c25333"},
    {n:"Dothraki",i:"🐎",c:"#a8562e"},{n:"Tyrell",i:"🌹",c:"#5a9a2b"},
    {n:"Tully",i:"🐟",c:"#3a86c8"},{n:"Arryn",i:"🦅",c:"#4a86c0"},
    {n:"Greyjoy",i:"🦑",c:"#7a72d0"},{n:"Martell",i:"☀️",c:"#e0a030"},
    {n:"Hightower",i:"🗼",c:"#2fa085"},{n:"Velaryon",i:"🌊",c:"#35b590"},
    {n:"Greyjoy del Mar",i:"⚓",c:"#6a63b0"},{n:"Bolton",i:"🩸",c:"#b83535"},
    {n:"Dayne",i:"⭐",c:"#e0c040"},{n:"FuegoOscuro",i:"⚫",c:"#888078"},
    {n:"Frey",i:"🏰",c:"#9a9188"},{n:"Mallister",i:"🦅",c:"#3a86c8"},
    {n:"Blackwood",i:"🌳",c:"#4a8a30"},{n:"Bracken",i:"🔶",c:"#d0902b"}
  ];

  const home=document.getElementById("home"),pick=document.getElementById("pick"),joust=document.getElementById("joust");
  const grid=document.getElementById("grid"),pickTurn=document.getElementById("pick-turn");
  const scoreboard=document.getElementById("scoreboard"),roundsEl=document.getElementById("rounds");
  const diceRow=document.getElementById("dice-row"),jlog=document.getElementById("jlog");
  const rider1=document.getElementById("rider1"),rider2=document.getElementById("rider2"),clash=document.getElementById("clash");
  const rollBtn=document.getElementById("roll-btn");

  let p1=null,p2=null,turn=1,round=0,busy=false,over=false;
  let rolls1=[],rolls2=[];

  function show(el){[home,pick,joust].forEach(x=>x.style.display="none");el.style.display="block";}

  HOUSES.forEach((h,idx)=>{
    const b=document.createElement("button");
    b.style.cssText="display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;border-radius:10px;border:0.5px solid var(--border);background:var(--surface-2);cursor:pointer;color:var(--text-primary)";
    b.innerHTML='<span style="font-size:22px;line-height:1">'+h.i+'</span><span style="display:flex;flex-direction:column;min-width:0"><span style="font-size:11px;color:var(--text-muted)">'+(idx+1)+'</span><span style="font-size:14px;font-weight:500;color:'+h.c+'">Casa '+h.n+'</span></span>';
    b.onmouseenter=()=>b.style.borderColor=h.c;b.onmouseleave=()=>b.style.borderColor="var(--border)";
    b.onclick=()=>choose(h);grid.appendChild(b);
  });

  function goPick(t){turn=t;pickTurn.textContent="Jugador "+t+" — elegí tu Casa";show(pick);}
  function choose(h){ if(turn===1){p1=h;goPick(2);} else {p2=h;startJoust();} }

  function renderBoard(){
    scoreboard.innerHTML='<span style="color:'+p1.c+';font-weight:500">'+p1.i+' Casa '+p1.n+'</span>'
      +'<span style="color:var(--text-muted);font-size:12px">saca 6 y ganás</span>'
      +'<span style="color:'+p2.c+';font-weight:500">Casa '+p2.n+' '+p2.i+'</span>';
    renderRounds();
    diceRow.innerHTML=die(1)+die(2);
  }
  function renderRounds(){
    let h="";
    for(let i=0;i<3;i++){
      const done=i<rolls1.length;
      const label=done?(rolls1[i]+" v "+rolls2[i]):(i+1);
      h+='<div style="min-width:52px;text-align:center;padding:4px 6px;border-radius:8px;border:0.5px solid var(--border);font-size:12px;color:'+(done?"var(--text-primary)":"var(--text-muted)")+';background:'+(i===round&&!over?"var(--surface-2)":"transparent")+'"><div style="font-size:10px;color:var(--text-muted)">Asalto '+(i+1)+'</div>'+label+'</div>';
    }
    roundsEl.innerHTML=h;
  }
  function die(s){return '<div style="text-align:center"><div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">J'+s+'</div><div id="d'+s+'" style="width:52px;height:52px;border-radius:12px;border:0.5px solid var(--border-strong);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:500;color:var(--text-primary)">–</div></div>';}

  function resetPositions(){
    rider1.style.transition="left 0s";rider2.style.transition="right 0s";
    rider1.style.left="6%";rider2.style.right="6%";rider1.style.opacity="1";rider2.style.opacity="1";
    rider1.style.bottom="28px";rider2.style.bottom="28px";
    clash.style.transition="transform 0s";clash.style.transform="translate(-50%,-50%) scale(0)";
  }
  function startJoust(){
    round=0;busy=false;over=false;rolls1=[];rolls2=[];
    renderBoard();resetPositions();
    jlog.textContent="Ambos caballeros ocupan sus puestos. ¡A tirar los dados!";
    show(joust);
  }
  function endGame(msg){over=true;jlog.textContent=msg;renderRounds();}

  rollBtn.onclick=()=>{
    if(busy)return;
    if(over){jlog.textContent="La justa terminó. Iniciá una nueva.";return;}
    busy=true;
    const r1=1+Math.floor(Math.random()*6), r2=1+Math.floor(Math.random()*6);
    resetPositions();jlog.textContent="¡Cargan!";
    void rider1.offsetWidth;
    rider1.style.transition="left 0.7s cubic-bezier(.55,0,.9,.6)";
    rider2.style.transition="right 0.7s cubic-bezier(.55,0,.9,.6)";
    rider1.style.left="40%";rider2.style.right="40%";

    setTimeout(()=>{
      clash.style.transition="transform .15s";clash.style.transform="translate(-50%,-50%) scale(1.1)";
      document.getElementById("d1").textContent=r1;
      document.getElementById("d2").textContent=r2;
      rolls1.push(r1);rolls2.push(r2);round++;
      renderRounds();

      const six1=r1===6, six2=r2===6;
      const throwOff=(who)=>{const r=who===1?rider1:rider2;r.style.transition="bottom .5s ease-in, opacity .5s";r.style.bottom="120px";r.style.opacity="0";};

      if(six1||six2){
        let msg;
        if(six1&&six2){msg="¡Ambos sacan 6! Doble desmontada, se declara empate del asalto.";}
        else if(six1){throwOff(2);msg="⚡ Casa "+p1.n+" saca un 6 y desmonta al rival. 🏆 ¡Casa "+p1.n+" gana la justa!";}
        else{throwOff(1);msg="⚡ Casa "+p2.n+" saca un 6 y desmonta al rival. 🏆 ¡Casa "+p2.n+" gana la justa!";}
        if((six1&&!six2)||(six2&&!six1)){endGame(msg);}
        else{jlog.textContent=msg;}
      } else {
        jlog.textContent="Asalto "+round+": empate ("+r1+" y "+r2+"), ambos se sostienen.";
      }

      if(!over && round>=3){
        const s1=rolls1.reduce((a,b)=>a+b,0), s2=rolls2.reduce((a,b)=>a+b,0);
        let msg="Los 3 asaltos terminaron en empate. Desempate por suma — Casa "+p1.n+": "+s1+" · Casa "+p2.n+": "+s2+". ";
        if(s1>s2)msg+="🏆 ¡Casa "+p1.n+" gana la justa!";
        else if(s2>s1)msg+="🏆 ¡Casa "+p2.n+" gana la justa!";
        else msg+="Igualdad total: ¡justa declarada en tablas!";
        setTimeout(()=>endGame(msg),0);
      }

      setTimeout(()=>{clash.style.transform="translate(-50%,-50%) scale(0)";busy=false;},700);
    },700);
  };

  // --- Música de fondo ---
  const music=document.getElementById("bg-music");
  const soundBtn=document.getElementById("sound-btn");
  let muted=false;
  function tryPlay(){ if(!muted){ music.play().catch(function(){}); } }
  soundBtn.onclick=function(){
    muted=!muted;
    if(muted){ music.pause(); soundBtn.textContent="🔇"; }
    else { music.play().catch(function(){}); soundBtn.textContent="🔊"; }
  };

  document.getElementById("start-btn").onclick=()=>{tryPlay();goPick(1);};
  document.getElementById("back-btn").onclick=()=>{ if(turn===2){goPick(1);}else{show(home);} };
  document.getElementById("reset-btn").onclick=()=>{p1=null;p2=null;goPick(1);};
})();
</script>
</body>
</html>
